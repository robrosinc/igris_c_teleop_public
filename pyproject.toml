# igris_c_teleop: VRS1 headset -> GMR -> ROS 2 motion reference + igris_c_sdk DDS producer.
#
# The environment is managed by pixi (https://pixi.sh). One Python 3.12 process needs
# GMR (mujoco/mink), rclpy and the igris_c_sdk pybind wheel at the same time:
#   * RoboStack (robostack-jazzy) provides ROS 2 Jazzy as conda packages, so rclpy lives
#     inside .pixi/envs and nothing is taken from a host /opt/ros install. Channel order
#     and version bounds mirror the `core` feature of ~/workspace/repos/igris_c
#     (pyproject.toml), which is the env the robot NUC runs;
#   * this repo (source/igris_c_teleop) and thirdparty/vr_link are installed editable
#     from their own pyproject.toml, so no PYTHONPATH entry is needed for them;
#   * thirdparty/gmr is used straight from the submodule via PYTHONPATH
#     (scripts/activate_ros.sh): its setup.py pulls smplx/opencv/redis the producer does not need;
#   * the igris_c_sdk pybind wheel is a pypi URL dependency: the release wheel published in
#     github.com/robrosinc/igris_c_sdk_public (dist/, pinned by release tag; the release commit
#     names the internal igris_c_sdk commit it was built from). pixi.lock records the URL and
#     version only, no content hash: the tag is the pin, so a re-tagged release is not detected.
#     No SDK source is checked out here (a thirdparty/igris_c_sdk submodule built the wheel
#     until 2026-10-16); vr_link 2.1 vendors none and imports the wheel from this env;
#   * this env also runs vr_link's VRL2 sender (`vr-link-stream`, started next to the
#     producer by `pixi run teleop`), so it carries vr_link's `video` (PyAV) and
#     `calibration` (OpenCV, pyyaml) feature dependencies, same bounds as vr_link's
#     own pixi manifest.
#
#   pixi install
#   pixi run test
#   pixi run teleop -- --dds_namespace igris_c_<unit> --target robot       # producer + headset video downlink
#   pixi run producer -- --dds_namespace igris_c_<unit>                    # producer only (dev/debug)

[project]
name = "igris_c_teleop"
version = "0.1.0"
description = "VRS1 headset teleoperation producer for the IGRIS-C whole-body policy runtime"
requires-python = "==3.12.*"
readme = "README.md"
# Runtime deps are supplied by pixi (conda + pypi sections below), not by this list:
# rclpy/torch/etc. must not be re-resolved from PyPI when the package is installed editable.
dependencies = []

[project.scripts]
igris-c-gmr = "igris_c_teleop.app.producer:main"
igris-c-teleop = "igris_c_teleop.app.teleop:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["source"]

[tool.pixi.workspace]
# RoboStack first (list order = priority) so shared packages (python, libstdcxx, ...)
# resolve from the RoboStack-aligned set, as in igris_c's `core` feature.
channels = ["https://prefix.dev/robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
pip = "*"
numpy = ">=2.0"
scipy = ">=1.13"
# general_motion_retargeting imports torch at package import.
pytorch-cpu = ">=2.4"
pytest = ">=8"
# --- ROS 2 Jazzy (RoboStack). Bounds copied from igris_c pyproject.toml [tool.pixi.feature.core.dependencies]
# so both envs resolve inside the same Jazzy release line. rmw_fastrtps_cpp is the Jazzy default and
# what igris_c ships; the inference node it talks to runs the same RMW.
ros-jazzy-rclpy = ">=7.1.9,<8"
ros-jazzy-std-msgs = ">=5.3.6,<6"
ros-jazzy-rmw-fastrtps-cpp = ">=8.4.3,<9"
# --- vr-link-stream (vr_link `video` + `calibration` features, bounds copied from
# thirdparty/vr_link/pyproject.toml). conda-forge ffmpeg behind PyAV carries libx264,
# h264_nvenc, h264_vaapi, h264_qsv; OpenCV decodes the camera JPEG topic.
av = ">=17.0.1,<18"
opencv = ">=4.10,<5"
pyyaml = ">=6.0,<7"

[tool.pixi.pypi-dependencies]
# This repo and the VRS1 receiver, installed editable (source/ and thirdparty/vr_link
# stay the import roots; edits are live). Repository and distribution were renamed
# vr_link_schema / vr-link-schema -> vr_link / vr-link in 2026-09.
igris_c_teleop = { path = ".", editable = true }
vr-link = { path = "thirdparty/vr_link", editable = true }
# igris_c_sdk pybind binding (CycloneDDS statically linked), the release wheel of the public
# deliverable repo, pinned by release tag. To update: change the tag AND the wheel filename
# together, `pixi install`, then check-env / test / README verification (the DDS output moves
# the robot). The wheel is tagged py3-none-any but is linux x86_64 / CPython 3.12 only; a
# mismatch fails at import, which `pixi run check-env` catches. Wire compatibility: the release
# commit of igris_c_sdk_public names the internal igris_c_sdk commit (v2.1.1 <- 8bc8c7b).
igris_c_sdk = { url = "https://github.com/robrosinc/igris_c_sdk_public/raw/v2.1.1/dist/igris_c_sdk-2.1.1-py3-none-any.whl" }
# Versions are the ones the producer was exercised with in igris_c_teleop_env (2026-09).
mujoco = ">=3.3"
mink = ">=1.3"
daqp = ">=0.9"
qpsolvers = ">=4.5"
loop-rate-limiters = ">=1.2"
rich = "*"
joblib = "*"
# general_motion_retargeting/__init__ imports robot_motion_viewer -> imageio (viewer unused by the producer).
imageio = ">=2.34"
# vr_link/src (vr_link) decodes VRS1 FlatBuffers; must match the pinned flatc.
flatbuffers = ">=24,<26"

[tool.pixi.activation]
scripts = ["scripts/activate_ros.sh"]

[tool.pixi.tasks]
# teleop = the full session (producer + vr-link-stream, two child processes); producer = the producer alone.
teleop = { cmd = "igris-c-teleop", description = "Teleop session: producer + vr-link-stream headset video downlink (append -- --dds_namespace <ns> [--target robot|usb|mujoco|isaac|shm] [producer args])" }
producer = { cmd = "igris-c-gmr", description = "Run the producer alone, no video downlink (append -- --dds_namespace <ns> ...)" }
replay = { cmd = "igris-c-gmr --no_dds --replay_vrs1", description = "Headset-free ROS-only replay (append -- <file>.vrs1)" }
# launch_testing's pytest plugin (if present in the env) autoloads and breaks collection.
test = { cmd = "pytest tests -m 'not ros' -q", env = { PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" } }
test-ros = { cmd = "pytest tests -m ros -q", env = { PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1", ROS_LOCALHOST_ONLY = "1" } }
check-env = { cmd = "python -c \"import rclpy, igris_c_sdk, mujoco, mink, vr_link, general_motion_retargeting, igris_c_teleop; print('igris_c_sdk:', igris_c_sdk.__file__); print('rclpy:', rclpy.__file__); print('ChannelFactory' in dir(igris_c_sdk) or 'SHADOWED by rosidl package')\"" }

[tool.pytest.ini_options]
pythonpath = ["source", "tests"]
testpaths = ["tests"]
markers = ["ros: needs a working rclpy (real ROS 2 round trip)"]

[tool.ruff]
line-length = 120
target-version = "py312"
